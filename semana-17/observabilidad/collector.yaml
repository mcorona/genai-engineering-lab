# Week 17, activity 2: the Collector of the observability stack (docker-compose.yml mounts it read-only).
#
#   OTLP (HTTP 4318, gRPC 4317) -> memory_limiter -> redaction -> transform/redaccion -> batch
#       -> file (traces as JSONL, rotated)  and  Langfuse (OTLP HTTP, Basic auth with the project keys)
#
# Redaction runs BEFORE any exporter, so neither Langfuse nor the file ever sees a masked value. Measured in
# activity 2 (resultados/stack.md), the two processors are complementary:
#   * `redaction` masks string values of span, resource and span-event attributes;
#   * `transform/redaccion` masks what `redaction` does not read: the span name, the span status message and the
#     span event names (it also masks string attributes again, as a second layer).
# The gap measured in activity 2 (neither reads LIST-valued attributes) is closed since activity 9: `redaction` runs in
# allowlist mode with exactly the keys of the locked span shape, so an unknown key, a list or captured content is dropped
# whole before any pattern is needed.
# Message content capture is OFF by default in the instrumentation; this pipeline is the second layer, not the first.
#
# The same seven patterns appear in `redaction` and in every `transform/redaccion` statement (a test checks that).
# Tail sampling is not in this file on purpose: it would drop traces that activity 7 scores. It is an overlay,
# `muestreo.yaml`, merged as a second `--config` when the stack starts with `arrancar.sh --muestreo`; the default is
# `sin_muestreo.yaml` (a no-op), so the default stack keeps every trace.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  redaction:
    # Activity 9: ALLOWLIST mode. Only the keys of the locked span shape (instrumentacion/esquema.py: span kinds, SDK spans and the
    # lab's events) and six resource keys pass; every other attribute is dropped whole, lists included (the gap measured in
    # activity 2), and so is any content a library captures (gen_ai.input.messages, prompts, completions). tests/test_seguridad_obs.py
    # checks this list equals the schema, so a new key needs both. blocked_values below still mask what an ALLOWED key carries.
    allow_all_keys: false
    allowed_keys:
      - db.namespace
      - db.operation.name
      - db.response.returned_rows
      - db.system.name
      - error.type
      - gen_ai.agent.name
      - gen_ai.operation.name
      - gen_ai.provider.name
      - gen_ai.request.max_tokens
      - gen_ai.request.model
      - gen_ai.request.reasoning.level
      - gen_ai.response.finish_reasons
      - gen_ai.response.id
      - gen_ai.response.model
      - gen_ai.tool.call.id
      - gen_ai.tool.name
      - gen_ai.tool.type
      - gen_ai.usage.cache_creation.input_tokens
      - gen_ai.usage.cache_read.input_tokens
      - gen_ai.usage.input_tokens
      - gen_ai.usage.output_tokens
      - jsonrpc.request.id
      - lab.authz.client
      - lab.authz.decision
      - lab.authz.scopes.granted
      - lab.authz.scopes.missing
      - lab.authz.scopes.required
      - lab.budget.decision
      - lab.budget.estimate_tokens
      - lab.budget.estimate_usd
      - lab.budget.limit_tokens
      - lab.budget.limit_usd
      - lab.budget.max_output_tokens
      - lab.budget.max_seconds
      - lab.budget.max_steps
      - lab.budget.max_tokens
      - lab.budget.max_tokens_total
      - lab.budget.max_tool_calls
      - lab.budget.model.from
      - lab.budget.reason
      - lab.budget.scope
      - lab.budget.spent_tokens
      - lab.budget.spent_usd
      - lab.budget.step
      - lab.cost.usd
      - lab.db.query.chars
      - lab.db.query.hmac
      - lab.db.role
      - lab.db.tables
      - lab.guardrail.decision
      - lab.guardrail.name
      - lab.guardrail.reason
      - lab.guardrail.stage
      - lab.guardrail.step
      - lab.hitl.amount_mxn
      - lab.hitl.applied
      - lab.hitl.approver
      - lab.hitl.approver_level
      - lab.hitl.decision
      - lab.hitl.evidence
      - lab.hitl.level
      - lab.hitl.quantity
      - lab.hitl.reason
      - lab.hitl.request_id
      - lab.hitl.requester
      - lab.hitl.state
      - lab.hitl.step
      - lab.hitl.ttl_s
      - lab.hitl.wait_ms
      - lab.model.scripted
      - lab.outcome.reason
      - lab.outcome.status
      - lab.run.cost_usd
      - lab.run.id
      - lab.run.steps
      - lab.run.tokens.cache_creation
      - lab.run.tokens.cache_read
      - lab.run.tokens.input
      - lab.run.tokens.output
      - lab.run.tool_calls
      - lab.run.tool_errors
      - lab.schema.version
      - lab.step
      - lab.task.id
      - lab.task.language
      - lab.tenant.id
      - lab.tool.args.chars
      - lab.tool.args.hmac
      - lab.tool.known
      - lab.tool.name
      - lab.tool.result.chars
      - lab.tool.status
      - langfuse.observation.cost_details
      - mcp.method.name
      - mcp.protocol.version
      - rpc.response.status_code
      - server.address
      - server.port
      - service.instance.id
      - service.name
      - service.version
      - telemetry.sdk.language
      - telemetry.sdk.name
      - telemetry.sdk.version
      - user.id
    blocked_values:
      - "postgres(ql)?://[^\\s\"']+"                       # DSNs
      - "(?i)bearer\\s+[A-Za-z0-9._~+/=-]{12,}"           # bearer tokens
      - "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+"   # JWTs (OAuth access tokens)
      - "sk-ant-[A-Za-z0-9_-]{10,}"                       # Anthropic keys
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"  # emails
      - "\\b[A-ZÑ&]{3,4}\\d{6}[A-Z0-9]{3}\\b"              # Mexican RFC tax IDs
      - "\\b\\d{2} \\d{4} \\d{4}\\b"                       # MX phone numbers (lab format)
    summary: info
  transform/redaccion:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(name, "(postgres(ql)?://[^\\s\"']+|(?i:bearer)\\s+[A-Za-z0-9._~+/=-]{12,}|eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+|sk-ant-[A-Za-z0-9_-]{10,}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}|\\b[A-ZÑ&]{3,4}\\d{6}[A-Z0-9]{3}\\b|\\b\\d{2} \\d{4} \\d{4}\\b)", "****")
          - replace_pattern(status.message, "(postgres(ql)?://[^\\s\"']+|(?i:bearer)\\s+[A-Za-z0-9._~+/=-]{12,}|eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+|sk-ant-[A-Za-z0-9_-]{10,}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}|\\b[A-ZÑ&]{3,4}\\d{6}[A-Z0-9]{3}\\b|\\b\\d{2} \\d{4} \\d{4}\\b)", "****")
          - replace_all_patterns(attributes, "value", "(postgres(ql)?://[^\\s\"']+|(?i:bearer)\\s+[A-Za-z0-9._~+/=-]{12,}|eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+|sk-ant-[A-Za-z0-9_-]{10,}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}|\\b[A-ZÑ&]{3,4}\\d{6}[A-Z0-9]{3}\\b|\\b\\d{2} \\d{4} \\d{4}\\b)", "****")
      - context: spanevent
        statements:
          - replace_pattern(name, "(postgres(ql)?://[^\\s\"']+|(?i:bearer)\\s+[A-Za-z0-9._~+/=-]{12,}|eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+|sk-ant-[A-Za-z0-9_-]{10,}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}|\\b[A-ZÑ&]{3,4}\\d{6}[A-Z0-9]{3}\\b|\\b\\d{2} \\d{4} \\d{4}\\b)", "****")
          - replace_all_patterns(attributes, "value", "(postgres(ql)?://[^\\s\"']+|(?i:bearer)\\s+[A-Za-z0-9._~+/=-]{12,}|eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]+|sk-ant-[A-Za-z0-9_-]{10,}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}|\\b[A-ZÑ&]{3,4}\\d{6}[A-Z0-9]{3}\\b|\\b\\d{2} \\d{4} \\d{4}\\b)", "****")
  batch:
    timeout: 200ms

exporters:
  file:
    path: /salida/trazas.jsonl
    flush_interval: 200ms
    rotation:                      # the raw trace file is bounded: 20 MB per file, 5 files, 7 days
      max_megabytes: 20
      max_backups: 5
      max_days: 7
  otlp_http/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH}"
    sending_queue:                 # a Langfuse outage must not lose traces nor block the agent
      enabled: true
      queue_size: 1000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, redaction, transform/redaccion, batch]
      exporters: [file, otlp_http/langfuse]
