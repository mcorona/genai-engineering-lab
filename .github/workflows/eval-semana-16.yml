name: eval-semana-16

# Week 16. Without the API ($0): validate --strict on the marketplace and the plugin, tests of the hooks, the guard, the
# read-only server, the in-house evaluator, packaging and a clean install, and the ground truth recomputed on the CI
# database and compared with the frozen one. With the API (activity 10, Haiku 5.5, cap per run): `claude plugin eval` with
# deterministic graders and the quality evaluator on 2 real audits (a read-only DSN; the week 14 MCP server with a token
# from an ephemeral Keycloak). Thresholds calibrated with the week 10 rule; security has no threshold.
on:
  pull_request:
    paths:
      - "semana-16/**"
      - "!semana-16/**/*.md"          # documentation and results do not run the CI
      - "!semana-16/resultados/**"
      - "semana-07/ci/**"
      - "semana-10/legado/**"
      - "semana-13/seguridad/artnot.sql"
      - "semana-13/golden/reglas_negocio.json"
      - "semana-13/herramientas/diccionario_extra.json"
      - "semana-14/servidor/**"
      - "semana-14/auth/**"
      - ".github/workflows/eval-semana-16.yml"
      - ".claude-plugin/**"
      - "!**/README.md"               # no eval reads a README (the English notes next to the data)

permissions:
  contents: read

concurrency:
  group: eval-semana-16-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_DSN: postgresql://admin:ci-admin@localhost:5432/inventory
      PG_DSN: postgresql://copilot_ro:ci-ro@localhost:5432/inventory
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: Dependencies and pinned Claude Code
        run: |
          pip install "psycopg[binary]==3.3.6" "sqlglot==30.26.0" "mcp==2.3.0" "pyyaml==6.0.2" "pydantic==2.14.1" \
            "jsonschema==4.26.0" "pyjwt[crypto]==2.15.1" pytest
          npm install -g @anthropic-ai/claude-code@2.1.316
          claude --version
      - name: claude plugin validate --strict (marketplace and plugin)
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict --profile directory semana-16/legacy-schema-audit
      - name: Ephemeral week 14 Keycloak (legacybridge realm, random passwords per job)
        run: semana-14/auth/arrancar.sh
      - name: CI database (seed 42), legacy schema, notes and seeded risks
        run: |
          python semana-07/ci/preparar_base.py
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-10/legado/legado.sql
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-13/seguridad/artnot.sql
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-16/verdad/riesgos.sql
      - name: Tests without the API (hooks, guard, server, in-house evaluator, packaging, simulated eval circuit)
        run: |
          cd semana-16 && python -m pytest -q tests -p no:cacheprovider -rs | tee /tmp/pytest.txt
          if grep -q "SKIPPED" /tmp/pytest.txt; then echo "::error::some tests were skipped"; exit 1; fi
      - name: Recomputed ground truth = frozen
        run: python semana-16/verdad/construir.py
      - name: Mini eval with the API (Haiku 5.5; deterministic plugin eval and 2 audits; cap per run)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_DE_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: python semana-16/ci/eval_ci.py --dir "$RUNNER_TEMP/eval16"
      - name: Mini eval evidence (redacted; synthetic data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-semana-16
          path: ${{ runner.temp }}/eval16
          retention-days: 14
          if-no-files-found: ignore
      - name: Stop Keycloak
        if: always()
        run: semana-14/auth/arrancar.sh --borrar
