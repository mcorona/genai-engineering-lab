name: eval-semana-16

# Semana 16. Sin API ($0): validate --strict del marketplace y del plugin, pruebas de hooks, guardia, servidor de solo
# lectura, evaluador propio, empaquetado e instalación desde cero, y la verdad de referencia recalculada en la base de CI
# y comparada con la congelada. Con API (actividad 10, Haiku 5.5, tope por corrida): `claude plugin eval` con graders
# deterministas y el evaluador de calidad sobre 2 auditorías reales (DSN de solo lectura; servidor MCP de la semana 14
# con un token de un Keycloak efímero). Umbrales calibrados con la regla de la semana 10; seguridad sin umbral.
on:
  pull_request:
    paths:
      - "semana-16/**"
      - "!semana-16/**/*.md"          # documentación y resultados: no corren la CI
      - "!semana-16/resultados/**"
      - "semana-07/ci/**"
      - "semana-10/legado/**"
      - "semana-13/seguridad/artnot.sql"
      - "semana-13/golden/reglas_negocio.json"
      - "semana-13/herramientas/diccionario_extra.json"
      - "semana-14/servidor/**"
      - "semana-14/auth/**"
      - ".github/workflows/eval-semana-16.yml"
      - ".claude-plugin/**"

permissions:
  contents: read

concurrency:
  group: eval-semana-16-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_DSN: postgresql://admin:ci-admin@localhost:5432/inventory
      PG_DSN: postgresql://copilot_ro:ci-ro@localhost:5432/inventory
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Dependencias y Claude Code fijado
        run: |
          pip install "psycopg[binary]==3.3.6" "sqlglot==30.26.0" "mcp==2.3.0" "pyyaml==6.0.2" "pydantic==2.14.1" \
            "jsonschema==4.26.0" "pyjwt[crypto]==2.15.1" pytest
          npm install -g @anthropic-ai/claude-code@2.1.316
          claude --version
      - name: claude plugin validate --strict (marketplace y plugin)
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict --profile directory semana-16/legacy-schema-audit
      - name: Keycloak efímero de la semana 14 (realm legacybridge, contraseñas aleatorias del job)
        run: semana-14/auth/arrancar.sh
      - name: Base de CI (semilla 42), esquema legado, notas y riesgos sembrados
        run: |
          python semana-07/ci/preparar_base.py
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-10/legado/legado.sql
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-13/seguridad/artnot.sql
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-16/verdad/riesgos.sql
      - name: Pruebas sin API (hooks, guardia, servidor, evaluador propio, empaquetado, circuito de la eval simulado)
        run: |
          cd semana-16 && python -m pytest -q tests -p no:cacheprovider -rs | tee /tmp/pytest.txt
          if grep -q "SKIPPED" /tmp/pytest.txt; then echo "::error::hay pruebas omitidas"; exit 1; fi
      - name: Verdad recalculada = congelada
        run: python semana-16/verdad/construir.py
      - name: Mini eval con API (Haiku 5.5; plugin eval determinista y 2 auditorías; tope por corrida)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_DE_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: python semana-16/ci/eval_ci.py --dir "$RUNNER_TEMP/eval16"
      - name: Evidencia de la mini eval (redactada; datos sintéticos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-semana-16
          path: ${{ runner.temp }}/eval16
          retention-days: 14
          if-no-files-found: ignore
      - name: Detener Keycloak
        if: always()
        run: semana-14/auth/arrancar.sh --borrar
