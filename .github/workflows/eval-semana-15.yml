name: eval-semana-15

# Week 15. Without the API: the common harness, the same agent in LangGraph and Strands (equivalence, limits, interruption),
# spikes, multi-agent and A2A, AgentCore (package, permissions and infrastructure, simulated) and the decision matrix.
# With the API (activity 10): a mini eval of LangGraph and Strands against the week 14 MCP server with OAuth from an
# ephemeral Keycloak, plus one poisoning case per category; calibrated thresholds and a cap per run (semana-15/ci/eval_ci.py).
on:
  pull_request:
    paths:
      - "semana-15/**"
      - "!semana-15/**/*.md"          # documentation and results do not pay for an eval
      - "!semana-15/resultados/**"
      - "semana-13/agente/**"
      - ".github/workflows/eval-semana-15.yml"

permissions:
  contents: read

concurrency:   # a new push cancels the previous run of the same PR (no paying for an eval that no longer counts)
  group: eval-semana-15-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_DSN: postgresql://admin:ci-admin@localhost:5432/inventory
      PG_DSN: postgresql://copilot_ro:ci-ro@localhost:5432/inventory
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install the main environment's dependencies
        run: pip install "psycopg[binary]==3.3.6" "pydantic==2.14.1" "sqlglot==30.26.0" "mcp==2.3.0" "jsonschema==4.26.0" "pyjwt[crypto]==2.15.1" pytest
      - name: One virtual environment per framework (LangGraph, Strands, OpenAI Agents, ADK)
        run: semana-15/linea_base/preparar.sh
      - name: Ephemeral week 14 Keycloak (legacybridge realm, random passwords per job)
        run: semana-14/auth/arrancar.sh
      - name: Prepare the CI database (synthetic data, seed 42) and the legacy schema
        run: |
          python semana-07/ci/preparar_base.py
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-10/legado/legado.sql
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-13/seguridad/artnot.sql
      - name: Tests without the API (harness, LangGraph, Strands, spikes, multi-agent, AgentCore, matrix, CI decision)
        run: |
          cd semana-15 && python -m pytest -q tests -p no:cacheprovider -rs | tee /tmp/pytest.txt
          if grep -q "SKIPPED" /tmp/pytest.txt; then echo "::error::some tests were skipped"; exit 1; fi
      - name: LangGraph and Strands mini eval (Haiku 5.5 low, cap per run)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_DE_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: cd semana-15 && python ci/eval_ci.py
      - name: Stop Keycloak
        if: always()
        run: semana-14/auth/arrancar.sh --borrar
