name: eval-semana-11

# Runs on every PR so that its two checks can be required by the ruleset: if the PR touches neither semana-11/** nor
# this workflow, both jobs are skipped (a skipped job counts as passed) and nothing is spent.
on:
  pull_request:

permissions:
  contents: read

jobs:
  cambios:
    runs-on: ubuntu-24.04
    outputs:
      semana11: ${{ steps.filtro.outputs.semana11 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: filtro
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(semana-11/|\.github/workflows/eval-semana-11\.yml$)'; then
            echo "semana11=true" >> "$GITHUB_OUTPUT"
          else
            echo "semana11=false" >> "$GITHUB_OUTPUT"
          fi

  recuperacion:
    name: semana11-recuperacion
    needs: cambios
    if: needs.cambios.outputs.semana11 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_DSN: postgresql://admin:ci-admin@localhost:5432/inventory
      NLQ_DSN: postgresql://copilot_ro:ci-ro@localhost:5432/inventory
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install "psycopg[binary]==3.3.6"
      - name: Prepare the CI database (copilot_ro role and synthetic data, seed 42)
        run: python semana-07/ci/preparar_base.py
      - name: Retrieval suite (index, top 20, reranking; exact metrics)
        run: python semana-11/ci/eval_ci.py --suite recuperacion

  generacion:
    name: semana11-generacion
    needs: cambios
    if: needs.cambios.outputs.semana11 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install dependencies (unit 11 versions)
        run: >-
          pip install "psycopg[binary]==3.3.6" anthropic==1.15.0 openai==3.3.0 instructor==1.17.0
          ragas==0.4.3 langchain-community==0.4.1 langchain-core==1.7.0 langchain-openai==1.7.3
      - name: Generation suite (fixed contexts; RAGAS, in-house judge, citations and abstention)
        run: python semana-11/ci/eval_ci.py --suite generacion
