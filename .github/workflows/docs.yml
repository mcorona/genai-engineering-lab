name: docs

# English documentation checks: offline, $0 (no model, no cloud). The glossary is linked from every README that uses
# its terms, the root README's index lists every week (docs/tests), and every file the PR changes keeps its figures
# (docs/check_figures.py: a translation never changes a number). A PR whose new figures are the point (a results
# report filled from a new measurement) carries the label `cifras-nuevas`, and the figures step is skipped for it; the
# documentation tests still run. Adding or removing the label reruns the workflow. The step reads the PR's labels when
# it runs, not from the event: `gh pr create --label` opens the PR and adds the label a moment later, so the run of
# the "opened" event did not see it and failed next to the passing run of the "labeled" event (#353).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "**/*.md"
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install pytest
        run: pip install pytest==9.2.0
      - name: Documentation tests
        run: python -m pytest -q -p no:cacheprovider docs/tests
      - name: Figures check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.labels[].name' | grep -qx 'cifras-nuevas'; then
            echo "PR labeled cifras-nuevas: its new figures are the point; figures check skipped"
          else
            python docs/check_figures.py --base origin/${{ github.base_ref }}
          fi
