name: recuperacion-semana-09

on:
  pull_request:
    paths:
      - "semana-09/**"
      - "!semana-09/README.md"
      - "!semana-09/resultados/**/*.md"
      - ".github/workflows/recuperacion-semana-09.yml"
      - "!**/README.md"               # no eval reads a README (the English notes next to the data)

permissions:
  contents: read

jobs:
  recuperacion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_DSN: postgresql://postgres:ci@localhost:5432/postgres
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]"
      - run: python semana-09/ci/permisos_ci.py
