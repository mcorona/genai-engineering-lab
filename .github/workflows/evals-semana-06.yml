name: evals-semana-06

# Runs on every PR so that its `regresion` check can be required by the ruleset. When the PR does not touch the
# prompts, units 6 to 19, the root README, the dependencies or these workflows, the job is skipped (a skipped job
# counts as passed) and nothing is spent.
on:
  pull_request:

permissions:
  contents: read

jobs:
  cambios:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      regresion: ${{ steps.filtro.outputs.regresion }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: filtro
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(semana-05/prompts/|semana-05/run_prompts\.py$|semana-(0[6-9]|1[0-9])/|README\.md$|pyproject\.toml$|uv\.lock$|\.github/workflows/(evals-semana-06|nlq-semana-07)\.yml$)|(^|/)prompts/'; then
            echo "regresion=true" >> "$GITHUB_OUTPUT"
          else
            echo "regresion=false" >> "$GITHUB_OUTPUT"
          fi

  regresion:
    needs: cambios
    if: needs.cambios.outputs.regresion == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Run the regression evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python semana-06/evaluar.py
