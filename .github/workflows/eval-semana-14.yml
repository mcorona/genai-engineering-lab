name: eval-semana-14

# Week 14. Without the API: the SDK baseline, the threat matrix, primitives, HTTP transport, Keycloak (activity 4),
# OAuth and negative auth (activity 5), the secure client and poisoning defenses (activity 6), against Postgres and an
# ephemeral Keycloak per job. With the API (activity 8): an agent mini eval against the remote MCP server with OAuth,
# Haiku 5.5 low, with a cost cap per run (semana-14/ci/eval_ci.py).
on:
  pull_request:
    paths:
      - "semana-14/**"
      - "!semana-14/**/*.md"          # documentation and results do not pay for an eval
      - "!semana-14/resultados/**"
      - "semana-13/agente/**"
      - "semana-13/herramientas/**"
      - ".github/workflows/eval-semana-14.yml"

permissions:
  contents: read

concurrency:   # a new push cancels the previous run of the same PR (no paying for an eval that no longer counts)
  group: eval-semana-14-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_DSN: postgresql://admin:ci-admin@localhost:5432/inventory
      PG_DSN: postgresql://copilot_ro:ci-ro@localhost:5432/inventory
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install "psycopg[binary]==3.3.6" "pydantic==2.14.1" "sqlglot==30.26.0" "mcp==2.3.0" "jsonschema==4.26.0" "pyjwt[crypto]==2.15.1" pytest
      - name: Ephemeral Keycloak (legacybridge realm, random passwords per job)
        run: semana-14/auth/arrancar.sh
      - name: Prepare the CI database (schema, copilot_ro and synthetic data, seed 42) and the legacy schema
        run: |
          python semana-07/ci/preparar_base.py
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-10/legado/legado.sql
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-13/seguridad/artnot.sql
      - name: SDK baseline (24 checks)
        run: python semana-14/linea_base/verificar_sdk.py
      - name: Contract, transport, Keycloak, OAuth, negative auth and poisoning defenses (no API)
        run: |
          cd semana-14 && python -m pytest -q tests -p no:cacheprovider -rs | tee /tmp/pytest.txt
          if grep -q "Keycloak no está corriendo" /tmp/pytest.txt; then echo "::error::the Keycloak tests were skipped"; exit 1; fi
      - name: Agent mini eval against the remote server (Haiku 5.5 low, cap per run)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_DE_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: cd semana-14 && python ci/eval_ci.py
      - name: Stop Keycloak
        if: always()
        run: semana-14/auth/arrancar.sh --borrar
