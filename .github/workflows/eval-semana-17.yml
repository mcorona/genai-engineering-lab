name: eval-semana-17

# Week 17 (reliability: human-in-the-loop, guardrails, token budgets, trajectory evals and observability with
# OpenTelemetry GenAI and Langfuse). Without the API ($0): every test in semana-17/tests (span schema, propagation,
# redaction with the real Collector, budgets, guardrails, the HITL state machine, trajectory evaluators, dashboard) with the
# CI database. An ephemeral week 14 Keycloak with the approver roles (real tokens through PKCE). With the API (activity 10,
# Haiku 5.5, cap per run): 10 tasks x ES/EN, 3 attacks, 1 HITL case and 1 exhausted-budget case, with the spans going
# through the real Collector (file exporter). Thresholds calibrated with the week 10 rule; security has no threshold.
# Langfuse stays out of CI (its ClickHouse is heavy): the traces are reviewed in the OTLP file.
on:
  pull_request:
    paths:
      - "semana-17/**"
      - "!semana-17/**/*.md"          # documentation and results do not run the CI
      - "!semana-17/resultados/**"
      - "semana-13/golden/**"
      - "semana-13/agente/**"
      - "semana-13/seguridad/**"      # activity 5: artnot.sql and the security cases the guardrails measure
      - "semana-13/resultados/**"     # activity 7: the recorded runs that calibrate and test the trajectories
      - "!semana-13/resultados/**/*.md"   # its Markdown reports: no step reads them
      - "semana-14/servidor/**"
      - "semana-14/cliente/**"
      - "semana-14/seguridad/**"
      - "semana-14/ataques/**"        # activity 5: the malicious servers of the 38 cases
      - "semana-14/auth/**"
      - "semana-15/resultados/sonda_trazas.json"
      - "semana-07/ci/**"
      - "semana-10/legado/**"
      - "pyproject.toml"
      - ".github/workflows/eval-semana-17.yml"
      - "!**/README.md"               # no eval reads a README (the English notes next to the data)

permissions:
  contents: read

concurrency:
  group: eval-semana-17-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sin-api:          # the name is kept although the job now calls the API: `sin-api` is a required check on main
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_DSN: postgresql://admin:ci-admin@localhost:5432/inventory
      PG_DSN: postgresql://copilot_ro:ci-ro@localhost:5432/inventory
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Dependencies (the same versions as the semana17 group in pyproject.toml)
        run: |
          pip install "psycopg[binary]==3.3.6" "sqlglot==30.26.0" "mcp==2.3.0" "pyyaml==6.0.2" pytest \
            "opentelemetry-api==1.45.2" "opentelemetry-sdk==1.45.2" "opentelemetry-exporter-otlp-proto-http==1.45.2" \
            "opentelemetry-semantic-conventions==0.66b2" "opentelemetry-instrumentation-httpx==0.66b2" "opentelemetry-util-genai==1.3b0" "langfuse==5.1.0" \
            "pydantic==2.14.1" "jsonschema==4.26.0" "pyjwt[crypto]==2.15.1"
      - name: CI database (seed 42) and legacy schema
        run: |
          python semana-07/ci/preparar_base.py
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-10/legado/legado.sql
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-13/seguridad/artnot.sql
      - name: Collector contrib 0.164.0 (release binary, verified by sha256)
        run: |
          curl -sSfL -o /tmp/otelcol.tgz https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.164.0/otelcol-contrib_0.164.0_linux_amd64.tar.gz
          echo "f0c1ce9f661399beb4a58b711924716e08ea70c3802db0715fcfde3cbbada2d4  /tmp/otelcol.tgz" | sha256sum -c -
          mkdir -p /tmp/otelcol && tar -xzf /tmp/otelcol.tgz -C /tmp/otelcol otelcol-contrib
          echo "OTELCOL_BIN=/tmp/otelcol/otelcol-contrib" >> "$GITHUB_ENV"
      - name: Setup (no Docker)
        run: python semana-17/preparar/verificar_entorno.py --sin-docker
      - name: Ephemeral week 14 Keycloak (legacybridge realm, random passwords per job)
        run: semana-14/auth/arrancar.sh
      - name: Tests without the API
        run: |
          set -o pipefail   # without this, `| tee` hides pytest's exit code and failing tests show as green
          cd semana-17 && python -m pytest -q tests -p no:cacheprovider -rs | tee /tmp/pytest.txt
          if grep -q "SKIPPED" /tmp/pytest.txt; then echo "::error::some tests were skipped"; exit 1; fi
      - name: Approver roles in the real Keycloak (partial import, PKCE tokens, approvals checker)
        env:
          SALIDA_KEYCLOAK: ${{ runner.temp }}/eval17/aprobaciones_keycloak.json
        run: |
          mkdir -p "$RUNNER_TEMP/eval17"
          cd semana-17 && python -m aprobaciones.keycloak
      - name: Mini eval with the API (Haiku 5.5; cap per run; security without a threshold)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_DE_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: python semana-17/ci/eval_ci.py --dir "$RUNNER_TEMP/eval17"
      - name: Mini eval evidence (redacted; synthetic data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-semana-17
          path: ${{ runner.temp }}/eval17
          retention-days: 14
          if-no-files-found: ignore
      - name: Stop Keycloak
        if: always()
        run: semana-14/auth/arrancar.sh --borrar
