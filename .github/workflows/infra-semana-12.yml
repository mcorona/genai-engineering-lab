name: infra-semana-12

# No cloud credentials: checks the syntax of the infra scripts, that there are no keys in the repository, that the
# ingestion package is still frozen, and that the versioned results of the cloud runs are complete and consistent
# (the runs themselves are repeated only by hand, with eval-nube-semana-12).
on:
  pull_request:
    paths:
      - "semana-12/**"
      - ".github/workflows/infra-semana-12.yml"

jobs:
  revisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Infra script syntax
        run: |
          for f in semana-12/infra/*.sh; do bash -n "$f" && echo "ok $f"; done
      - name: Infra Python compiles
        run: python3 -m py_compile semana-12/infra/*.py
      - name: No credentials in the repository
        run: bash semana-12/infra/revisar_secretos.sh
      - name: Frozen ingestion package (rebuilt identical, gold set unchanged)
        run: |
          python3 semana-12/ingesta/construir_paquete.py > /dev/null
          git status --porcelain semana-12/ingesta/paquete
          git diff --exit-code --stat -- semana-12/ingesta/paquete
          test -z "$(git status --porcelain semana-12/ingesta/paquete)"
      - name: Versioned results complete and consistent
        run: python3 semana-12/evaluacion/validar_resultados.py
      - name: Comparison table up to date with the summaries
        run: |
          python3 semana-12/evaluacion/comparar.py > /dev/null
          git diff --exit-code --stat -- semana-12/resultados/comparacion.json semana-12/resultados/comparacion_tabla.md
