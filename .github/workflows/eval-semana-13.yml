name: eval-semana-13

on:
  pull_request:
    paths:
      - "semana-13/**"
      - ".github/workflows/eval-semana-13.yml"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_DSN: postgresql://admin:ci-admin@localhost:5432/inventory
      PG_DSN: postgresql://copilot_ro:ci-ro@localhost:5432/inventory
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install "psycopg[binary]==3.3.6" "pydantic==2.14.1" "sqlglot==30.26.0" "mcp==2.3.0" "claude-agent-sdk==0.2.175" pytest
      - name: Prepare the CI database (schema, copilot_ro and synthetic data, seed 42) and the legacy schema
        run: |
          python semana-07/ci/preparar_base.py
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-10/legado/legado.sql
          psql "$PG_ADMIN_DSN" -v ON_ERROR_STOP=1 -f semana-13/seguridad/artnot.sql
      - name: Unit and contract tests (no API)
        run: cd semana-13 && python -m pytest -q tests -p no:cacheprovider
      - name: Reduced agent and security suite (Haiku 5.5 low)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python semana-13/ci/eval_ci.py
