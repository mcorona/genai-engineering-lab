name: eval-semana-10

on:
  pull_request:
    paths:
      - "semana-10/**"
      - "!semana-10/README.md"
      - "!semana-10/resultados/**/*.md"
      - ".github/workflows/eval-semana-10.yml"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-admin
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d inventory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_DSN: postgresql://admin:ci-admin@localhost:5432/inventory
      NLQ_DSN: postgresql://copilot_ro:ci-ro@localhost:5432/inventory
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "psycopg[binary]" pdfplumber
      - name: Prepare the CI database (schema, copilot_ro and synthetic data, seed 42)
        run: python semana-07/ci/preparar_base.py
      - name: Routing, legacy SQL, recall of extracted content and security
        run: python semana-10/ci/eval_ci.py
