# Week 14, activity 4: a local OAuth 2.1 authorization server for the LegacyBridge MCP server.
# Do not start it directly: use ./arrancar.sh, which generates the local secrets (.secretos.env, outside Git).
name: legacybridge-auth

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command:
      - start-dev
      - --features=resource-indicators     # RFC 8707 (experimental in Keycloak 26.8)
      - --import-realm                     # imports realm/ only if the realm does not exist (idempotent)
      - --hostname=http://127.0.0.1:8180   # fixed issuer: http://127.0.0.1:8180/realms/legacybridge
      - --http-port=8080                   # port inside the container
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?usa ./arrancar.sh}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?usa ./arrancar.sh}
    ports:
      - "127.0.0.1:8180:8080"              # loopback only; 8180 on the host (8080 is often taken)
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
      - kc-datos:/opt/keycloak/data          # the volume inherits the owner (keycloak, uid 1000) of the image's directory
    restart: unless-stopped

volumes:
  kc-datos:
